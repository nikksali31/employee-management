{% extends "base.html" %}
{% block title %}Create Account | WorkFlowHub{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><div class="text-center mb-4"><div class="auth-logo"><i class="bi bi-person-plus"></i></div><h2>Create account</h2><p class="text-muted">Start using WorkFlowHub</p></div>
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100 py-2">Create Account</button></form><p class="text-center mt-3 mb-0">Already have an account? <a href="{% url 'login' %}">Login</a></p></div></div>{% endblock %}
